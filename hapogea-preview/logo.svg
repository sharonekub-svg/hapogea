<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#1c2e42"/>
      <stop offset="60%" stop-color="#0e1a28"/>
      <stop offset="100%" stop-color="#060d14"/>
    </radialGradient>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dff0ff"/>
      <stop offset="45%" stop-color="#8ac4e8"/>
      <stop offset="100%" stop-color="#3a7fa8"/>
    </linearGradient>
    <linearGradient id="rocketNose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef8ff"/>
      <stop offset="100%" stop-color="#aad4f0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="35%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#8b6010"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="50%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#ffe566"/>
    </linearGradient>
    <filter id="gBlue" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gRed" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="1" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.9"/>
    </filter>
    <clipPath id="circClip">
      <circle cx="250" cy="250" r="232"/>
    </clipPath>
  </defs>

  <!-- Main background circle -->
  <circle cx="250" cy="250" r="248" fill="url(#bg)"/>

  <!-- Neon blue outer ring -->
  <circle cx="250" cy="250" r="242" fill="none" stroke="#00c8ff" stroke-width="6" opacity="0.95" filter="url(#gBlue)"/>
  <circle cx="250" cy="250" r="236" fill="none" stroke="#0055dd" stroke-width="1.5" opacity="0.35"/>

  <!-- Neon red inner ring -->
  <circle cx="250" cy="250" r="226" fill="none" stroke="#dd0000" stroke-width="2.5" opacity="0.5" filter="url(#gRed)"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="#ff2222" stroke-width="4" opacity="0.8" filter="url(#gRed)"/>

  <g clip-path="url(#circClip)">

    <!-- Subtle tech grid -->
    <g stroke="#1e3a55" stroke-width="0.6" opacity="0.45">
      <line x1="80" y1="40" x2="80" y2="340"/>
      <line x1="120" y1="20" x2="120" y2="320"/>
      <line x1="380" y1="40" x2="380" y2="340"/>
      <line x1="420" y1="20" x2="420" y2="320"/>
      <line x1="40" y1="130" x2="170" y2="130"/>
      <line x1="40" y1="160" x2="160" y2="160"/>
    </g>

    <!-- Gold chevrons left -->
    <g filter="url(#gGold)" opacity="0.9">
      <path d="M55 195 L88 162 L100 172 L67 205 L100 238 L88 248 Z" fill="url(#gold)"/>
      <path d="M80 195 L113 162 L125 172 L92 205 L125 238 L113 248 Z" fill="url(#gold)"/>
      <path d="M55 228 L88 195 L100 205 L67 238 L100 271 L88 281 Z" fill="url(#gold)" opacity="0.55"/>
      <path d="M80 228 L113 195 L125 205 L92 238 L125 271 L113 281 Z" fill="url(#gold)" opacity="0.55"/>
    </g>

    <!-- Gold bar chart + arrow right -->
    <g filter="url(#gGold)" opacity="0.9">
      <rect x="335" y="245" width="16" height="52" rx="3" fill="url(#gold)"/>
      <rect x="357" y="218" width="16" height="79" rx="3" fill="url(#gold)"/>
      <rect x="379" y="188" width="16" height="109" rx="3" fill="url(#gold)"/>
      <rect x="401" y="168" width="16" height="129" rx="3" fill="url(#gold)" opacity="0.8"/>
      <!-- Rising arrow -->
      <line x1="343" y1="198" x2="418" y2="128" stroke="#d4a017" stroke-width="4" stroke-linecap="round"/>
      <path d="M418 128 L405 132 L413 144 Z" fill="#d4a017"/>
    </g>

    <!-- TARGET / BULLSEYE — large, occupies center-upper area -->
    <!-- Outermost shadow fill -->
    <circle cx="238" cy="210" r="130" fill="#550000" opacity="0.28"/>
    <!-- Ring 1 -->
    <circle cx="238" cy="210" r="128" fill="none" stroke="#882200" stroke-width="5" opacity="0.6"/>
    <!-- Ring 2 fill -->
    <circle cx="238" cy="210" r="95" fill="#771100" opacity="0.4"/>
    <circle cx="238" cy="210" r="95" fill="none" stroke="#cc2222" stroke-width="5" opacity="0.8"/>
    <!-- Ring 3 fill -->
    <circle cx="238" cy="210" r="62" fill="#990000" opacity="0.55"/>
    <circle cx="238" cy="210" r="62" fill="none" stroke="#ff3333" stroke-width="4.5" opacity="0.9"/>
    <!-- Inner bull -->
    <circle cx="238" cy="210" r="28" fill="#bb0000" opacity="0.9"/>
    <circle cx="238" cy="210" r="28" fill="none" stroke="#ff4444" stroke-width="2.5"/>
    <!-- Bullseye center -->
    <circle cx="238" cy="210" r="10" fill="#ff1111"/>
    <circle cx="234" cy="205" r="4" fill="white" opacity="0.25"/>

    <!-- Impact sparks -->
    <g stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.75">
      <line x1="238" y1="198" x2="235" y2="190"/>
      <line x1="248" y1="202" x2="256" y2="195"/>
      <line x1="238" y1="222" x2="235" y2="230"/>
      <line x1="248" y1="218" x2="256" y2="225"/>
      <line x1="226" y1="202" x2="218" y2="195"/>
      <line x1="226" y1="218" x2="218" y2="225"/>
      <circle cx="238" cy="210" r="3.5" fill="white" opacity="0.9"/>
    </g>

    <!-- ROCKET (rotated -42 deg, flying from lower-left into bullseye) -->
    <g transform="rotate(-42, 238, 210)">
      <!-- Shadow -->
      <g transform="translate(238,210)" opacity="0.25">
        <rect x="-11" y="-52" width="22" height="78" rx="5" fill="#000" transform="translate(4,4)"/>
      </g>
      <!-- Fins -->
      <g transform="translate(238,210)">
        <path d="M-10 22 L-26 62 L-10 48 Z" fill="#5a9dc0" opacity="0.9"/>
        <path d="M10 22 L26 62 L10 48 Z" fill="#5a9dc0" opacity="0.9"/>
        <!-- Fin detail -->
        <path d="M-10 34 L-20 54 L-10 46 Z" fill="#3a7090" opacity="0.7"/>
        <path d="M10 34 L20 54 L10 46 Z" fill="#3a7090" opacity="0.7"/>
      </g>
      <!-- Body -->
      <g transform="translate(238,210)">
        <rect x="-11" y="-52" width="22" height="78" rx="5" fill="url(#rocketBody)"/>
        <!-- Body highlight -->
        <rect x="-8" y="-48" width="5" height="70" rx="2.5" fill="white" opacity="0.18"/>
        <!-- Nose cone -->
        <path d="M-11 -52 L0 -92 L11 -52 Z" fill="url(#rocketNose)"/>
        <path d="M-5 -52 L0 -92 L5 -52 Z" fill="white" opacity="0.2"/>
        <!-- Porthole -->
        <circle cx="0" cy="-28" r="7" fill="#0a1a2e" stroke="#8ac4e8" stroke-width="2"/>
        <circle cx="0" cy="-28" r="4.5" fill="#1e5070" opacity="0.85"/>
        <circle cx="-2" cy="-30" r="1.5" fill="white" opacity="0.45"/>
        <!-- Exhaust -->
        <path d="M-7 26 L0 60 L7 26 Z" fill="#FF5500" opacity="0.92"/>
        <path d="M-5 32 L0 66 L5 32 Z" fill="#FFAA00" opacity="0.75"/>
        <ellipse cx="0" cy="70" rx="6" ry="9" fill="#FF3300" opacity="0.5"/>
      </g>
    </g>

  </g>

  <!-- Bottom dark band for text (outside clip so it overlays rings) -->
  <path d="M14 318 Q250 440 486 318 L486 486 Q250 498 14 486 Z" fill="rgba(6,12,20,0.92)"/>

  <!-- Main text: הפוגע -->
  <text x="250" y="408"
    font-family="'Heebo','Arial Hebrew',Arial,sans-serif"
    font-size="90"
    font-weight="900"
    text-anchor="middle"
    fill="#4fc3f7"
    stroke="#c8920a"
    stroke-width="3"
    paint-order="stroke"
    filter="url(#textShadow)">הפוגע</text>

  <!-- Subtitle: מהדורת פרימיום -->
  <text x="250" y="454"
    font-family="'Heebo','Arial Hebrew',Arial,sans-serif"
    font-size="28"
    font-weight="700"
    text-anchor="middle"
    fill="url(#goldH)"
    filter="url(#textShadow)">מהדורת פרימיום</text>

  <!-- Gold shield with star -->
  <g transform="translate(250,483)">
    <path d="M0 -20 L17 -13 L17 3 Q17 17 0 23 Q-17 17 -17 3 L-17 -13 Z"
      fill="url(#gold)" stroke="#ffe566" stroke-width="1"/>
    <path d="M0 -13 L2.5 -6 L10 -6 L4.5 -2 L6.5 5 L0 1 L-6.5 5 L-4.5 -2 L-10 -6 L-2.5 -6 Z"
      fill="#fff" opacity="0.95"/>
  </g>
</svg>